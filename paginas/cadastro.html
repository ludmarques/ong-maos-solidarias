<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cadastre-se como voluntário da Mãos Solidárias.">
  <title>Mãos Solidárias | Cadastro</title>
</head>
<body>
  <header>
    <img src="../img/logo.png" alt="Logotipo da ONG Mãos Solidárias" height="60">
    <nav aria-label="Navegação principal">
      <ul>
        <li><a href="../index.html">Início</a></li>
        <li><a href="projetos.html">Projetos</a></li>
        <li><a href="cadastro.html">Seja voluntário</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Seja um voluntário</h1>

    <section>
      <h2>Formulário de cadastro</h2>
      <p>Preencha os dados abaixo. Os campos com * são obrigatórios.</p>

      <form action="#" method="post">

        <fieldset>
          <legend>Dados pessoais</legend>

          <label for="nome">Nome completo *</label>
          <input type="text" id="nome" name="nome" autocomplete="name" required>

          <label for="nascimento">Data de nascimento *</label>
          <input type="date" id="nascimento" name="nascimento" required>

          <label for="cpf">CPF *</label>
          <input type="text" id="cpf" name="cpf"
                 inputmode="numeric" maxlength="14"
                 placeholder="000.000.000-00"
                 pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                 title="Digite o CPF no formato 000.000.000-00"
                 required>
        </fieldset>

        <fieldset>
          <legend>Contato</legend>

          <label for="email">E-mail *</label>
          <input type="email" id="email" name="email" autocomplete="email" required>

          <label for="telefone">Telefone *</label>
          <input type="tel" id="telefone" name="telefone"
                 autocomplete="tel" maxlength="15"
                 placeholder="(00) 00000-0000"
                 pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}"
                 title="Digite o telefone no formato (00) 00000-0000"
                 required>
        </fieldset>

        <fieldset>
          <legend>Endereço</legend>

          <label for="cep">CEP *</label>
          <input type="text" id="cep" name="cep"
                 inputmode="numeric" maxlength="9"
                 placeholder="00000-000"
                 pattern="[0-9]{5}-[0-9]{3}"
                 title="Digite o CEP no formato 00000-000"
                 required>

          <label for="endereco">Endereço *</label>
          <input type="text" id="endereco" name="endereco" autocomplete="address-line1" required>

          <label for="cidade">Cidade *</label>
          <input type="text" id="cidade" name="cidade" required>

          <label for="estado">Estado *</label>
          <select id="estado" name="estado" required>
            <option value="">Selecione</option>
            <option value="AC">AC</option><option value="AL">AL</option>
            <option value="AP">AP</option><option value="AM">AM</option>
            <option value="BA">BA</option><option value="CE">CE</option>
            <option value="DF">DF</option><option value="ES">ES</option>
            <option value="GO">GO</option><option value="MA">MA</option>
            <option value="MT">MT</option><option value="MS">MS</option>
            <option value="MG">MG</option><option value="PA">PA</option>
            <option value="PB">PB</option><option value="PR">PR</option>
            <option value="PE">PE</option><option value="PI">PI</option>
            <option value="RJ">RJ</option><option value="RN">RN</option>
            <option value="RS">RS</option><option value="RO">RO</option>
            <option value="RR">RR</option><option value="SC">SC</option>
            <option value="SP">SP</option><option value="SE">SE</option>
            <option value="TO">TO</option>
          </select>
        </fieldset>

        <fieldset>
          <legend>Participação</legend>

          <label for="interesse">Como deseja ajudar? *</label>
          <select id="interesse" name="interesse" required>
            <option value="">Selecione</option>
            <option value="voluntario">Voluntariado</option>
            <option value="doacao">Doações</option>
            <option value="ambos">Ambos</option>
          </select>

          <label for="mensagem">Mensagem (opcional)</label>
          <textarea id="mensagem" name="mensagem" rows="4"></textarea>
        </fieldset>

        <button type="submit">Enviar cadastro</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Mãos Solidárias. Todos os direitos reservados.</p>
    <address>contato@maossolidarias.org</address>
  </footer>
</body>
</html>
